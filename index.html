<!DOCTYPE html>
<html lang="hi"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>संकेतवाणी – पिच वीडियो</title>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;800&family=Hind:wght@400;600&display=swap" rel="stylesheet">
<style>
:root{--navy:#14307a;--yel:#ffd54a;--blue:#2f6df6;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light dark}
*{box-sizing:border-box;margin:0}
html,body{height:100%;background:#0e1626;font-family:'Hind',sans-serif}
body{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px}
#stage{position:relative;width:min(100vw,calc((100vh - 60px)*16/9));aspect-ratio:16/9;background:#fff;overflow:hidden;container-type:inline-size;border-radius:6px}
.bg{position:absolute;inset:0;background:radial-gradient(40% 60% at 15% 20%,#cfe3ff 0,transparent 70%),radial-gradient(40% 60% at 90% 85%,#ffeaa0 0,transparent 70%),radial-gradient(35% 50% at 85% 10%,#dbeaff 0,transparent 70%),#fffdf7;animation:drift 12s ease-in-out infinite alternate}
@keyframes drift{to{transform:scale(1.12) translate(-1.5%,1%)}}
.sc{position:absolute;inset:0;display:none;align-items:center;justify-content:center;flex-direction:column;text-align:center}
.sc.on{display:flex}
.a{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards}
.t{opacity:0;animation:up .8s cubic-bezier(.2,.8,.2,1) var(--d,0s) forwards,out .6s ease var(--o,99s) forwards}
@keyframes up{from{opacity:0;transform:translateY(4cqw) scale(.96)}to{opacity:1;transform:none}}
@keyframes out{to{opacity:0;transform:translateY(-3cqw)}}
@keyframes pop{from{transform:scale(0);opacity:0}}
.big{font:800 4.6cqw/1.25 'Baloo 2',sans-serif;color:var(--navy)}
.sub{font-size:2.2cqw;color:#34457a;margin-top:.8cqw;max-width:90cqw}
.red{color:#d8283e}
.ul{display:inline-block;background:linear-gradient(var(--yel),var(--yel)) bottom/100% .9cqw no-repeat;padding-bottom:.4cqw}
.badge{font:800 2.2cqw 'Baloo 2';padding:.6cqw 2cqw;border-radius:5cqw;margin-bottom:2cqw}
.bp{background:#fde4e7;color:#d8283e}.bs{background:#dff5e6;color:#1d8a4c}.bf{background:#e4ecff;color:var(--blue)}
.logo{width:12cqw;height:12cqw;background:var(--yel);border-radius:3cqw;display:grid;place-items:center;box-shadow:0 2cqw 4cqw #14307a22}
.logo svg{width:70%;fill:var(--navy)}
.card{background:#fff;border-radius:2cqw;box-shadow:0 1.2cqw 3.5cqw #14307a22;padding:1.8cqw}
.g2{display:grid;grid-template-columns:repeat(2,34cqw);gap:1.8cqw;margin-top:2cqw}
.g2 .card{display:flex;gap:1.4cqw;align-items:center;text-align:left;font:600 2.2cqw/1.3 'Hind';color:var(--navy)}
.g2 i,.g3 i{font-style:normal;font-size:3.6cqw}
.g3{display:grid;grid-template-columns:repeat(3,17.5cqw);gap:1.6cqw;margin-top:2cqw}
.g3 .card{font:800 2.1cqw 'Baloo 2';color:var(--navy)}
.g3 small{display:block;font:400 1.5cqw 'Hind';color:#5a6a98}
.flow{display:flex;align-items:center;gap:.8cqw;margin-top:3cqw}
.flow .card{width:15cqw;padding:1.6cqw 1cqw;font:800 1.9cqw/1.25 'Baloo 2';color:var(--navy)}
.flow b{display:grid;place-items:center;width:3.6cqw;height:3.6cqw;border-radius:50%;background:var(--blue);color:#fff;margin:0 auto 1cqw;font-size:2cqw}
.flow b.y{background:var(--yel);color:var(--navy)}
.flow s{text-decoration:none;color:var(--blue);font-size:2.4cqw}
.chips{display:flex;gap:1cqw;margin-top:2.4cqw}
.chips span{background:#fff;padding:.6cqw 1.6cqw;border-radius:5cqw;font:600 1.6cqw 'Hind';color:var(--navy);box-shadow:0 .4cqw 1.4cqw #14307a22}
.fd{display:flex;gap:.8cqw;margin-top:2cqw}.fd u{width:2.2cqw;height:2.2cqw;border-radius:50%}
#ctl{display:flex;gap:12px;align-items:center;color:#cbd6f2;font-size:14px;width:min(100vw,900px);padding:0 12px}
#ctl button{background:var(--yel);border:0;border-radius:20px;padding:8px 18px;font:700 15px 'Hind';color:var(--navy);cursor:pointer}
#bar{flex:1;height:6px;background:#26334f;border-radius:3px;overflow:hidden}#bar i{display:block;height:100%;width:0;background:var(--yel)}
#seek{flex:1;accent-color:#ffd54a;cursor:pointer;min-width:60px}#ctl button{white-space:nowrap}body.fs #stage{width:min(100vw,calc(100vh*16/9));border-radius:0}
body.fs #ctl{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(14px + env(safe-area-inset-bottom,0px));background:#0e1626d9;border-radius:30px;padding:8px 16px;opacity:0;transition:opacity .3s;z-index:20}
body.fs #ctl.show{opacity:1}
body.fs:not(.ui){cursor:none}
#fs{background:#fff!important}
</style></head><body>
